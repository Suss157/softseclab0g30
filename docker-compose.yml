services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: softsec-api:latest
    container_name: softsec-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/hello')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s